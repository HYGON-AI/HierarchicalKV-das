name: pr-test

# 从目标分支读取工作流，测试 PR 与最新 master 的合并结果。
# 首次添加本文件需合入 master 后才会处理后续 PR 事件。
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Build and Test (BW1000 / DTK${{ matrix.dtk }})
    # 沿用 spconv-das：外部 fork 仅在维护者打 ready-hcu 标签的当次运行。
    # 后续新提交需复核、移除并重新打标签。
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ready-hcu') &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
       github.event.action == 'labeled')
    concurrency:
      group: hierarchicalkv-pr-test-${{ github.event.pull_request.number }}-dtk${{ matrix.dtk }}
      cancel-in-progress: true
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1000]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: "2604"
            image: BASE_IMAGE_UBUNTU_DTK2604_PY310
          - dtk: "2610"
            image: BASE_IMAGE_UBUNTU_DTK2610_PY312
    container:
      # 已包含 DTK，无需安装 DTK、torch 或打包工具。
      image: ${{ vars[matrix.image] }}
      volumes:
        - /opt/hyhal/:/opt/hyhal/:ro
      options: >-
        --device=/dev/kfd
        --device=/dev/dri
        --group-add=video
        --shm-size=16g
    steps:
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge PR into latest base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "pull/${PR_NUMBER}/head"
          # 确认拉取的是本次事件对应的提交，避免执行随后推送的未审核代码。
          test "$(git rev-parse FETCH_HEAD)" = "${PR_HEAD_SHA}"
          git -c user.name='HierarchicalKV CI' -c user.email='ci@localhost' \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"

      - name: Initialize submodules
        run: |
          set -euo pipefail
          git submodule update --init --recursive

      - name: Build
        run: |
          set -eo pipefail
          source /opt/dtk/env.sh
          set -u
          cmake -S . -B build -G "Unix Makefiles"
          make -C build -j32

      - name: Run all 16 test programs
        run: |
          set -eo pipefail
          source /opt/dtk/env.sh
          set -u
          cd build
          # 串行执行以减少显存争用，不运行 benchmark。
          tests=(
            accum_or_assign_test
            assign_score_test
            assign_values_test
            dynamic_max_capacity_test
            export_batch_if_test
            find_or_insert_ptr_lock_test
            find_or_insert_ptr_test
            find_or_insert_test
            find_with_missed_keys_test
            group_lock_test
            insert_and_evict_test
            lock_unlock_test
            merlin_hashtable_test
            merlin_memory_pool_test
            reserved_keys_test
            save_and_load_test
          )
          failed=0
          for test_name in "${tests[@]}"; do
            echo "::group::${test_name}"
            if [[ ! -x "./${test_name}" ]]; then
              echo "::error::Missing test executable: ${test_name}"
              failed=$((failed + 1))
            elif "./${test_name}"; then
              echo "PASS: ${test_name}"
            else
              status=$?
              echo "::error::${test_name} failed (exit ${status})"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Test programs: ${#tests[@]}, failed: ${failed}"
          test "${failed}" -eq 0

      - name: Clean build directory
        if: always()
        run: |
          # 在容器退出前清理可能归 root 所有的构建文件。
          rm -rf -- "${GITHUB_WORKSPACE:?}/build"
